<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number One</title>
    <style>
        .quiz {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            max-width: 400px;
            font-family: Arial, sans-serif;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin: 8px 0;
        }
        button.option {
            width: 100%;
            padding: 8px;
            border: 1px solid #999;
            background: #f5f5f5;
            cursor: pointer;
        }
        button.option:hover {
            background: #ddd;
        }
    </style>
</head>
<body>
    <button id="generate-btn">Generate Question</button>
    <div id="quiz-container"></div>
    <script>
        document.getElementById("generate-btn").addEventListener("click", function (event) {
            event.preventDefault();

            const quizContainer = document.getElementById("quiz-container");
            quizContainer.innerHTML = "";

            const question = "What is the capital of France?";
            const answers = ['Berlin', 'Madrid', 'Paris', 'Rome'];

            
            let listItems = "";
            answers.forEach(answer => {
                listItems += `<li><button class="option">${answer}</button></li>`;
            });

            
            const quizHTML = `
                <div class="quiz">
                    <p>${question}</p>
                    <ul>
                        ${listItems}
                    </ul>
                </div>
            `;

            quizContainer.innerHTML = quizHTML;
        });
    </script>
</body>
</html>
