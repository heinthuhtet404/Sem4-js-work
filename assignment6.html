<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 6</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        div {
            margin-bottom: 15px;
        }

        select {
            width: 200px;
            padding: 5px;
            margin-bottom: 10px;
        }

        button {
            padding: 5px 15px;
            margin-right: 5px;
            cursor: pointer;
        }

        .section {
            margin-bottom: 25px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h1>Where do you want to live?</h1>

    <div class="section">
        <h2>Add a location </h2>
        <select id="locationSelect" size="4">
            <option value="la">Los Angeles</option>
            <option value="mv">Mountain View</option>
            <option value="cn">China</option>
            <option value="au">Australia</option>
        </select>

        <div>
            <input type="text" id="newText" placeholder="Text (e.g., Japan)">
            <input type="text" id="newValue" placeholder="Value (e.g., jp)">
        </div>

        <div>
            <button id="addDomBtn">Add using DOM</button>
            <button id="addOptionBtn">Add using Option</button>
        </div>
    </div>

    <div class="section">
        <h2>Remove a location</h2>
        <button id="removeDomBtn">Remove using DOM</button>
        <button id="removeMethodBtn">Remove using remove()</button>
        <button id="removeNullBtn">Remove using null</button>
    </div>

    <div class="section">
        <h2>Get selected options</h2>
        <button id="getSelectedBtn">Show Selected Option</button>
        <div id="selectedInfo"></div>
    </div>

    <script>

        // Get references to all elements
        const locationSelect = document.getElementById('locationSelect');
        const newText = document.getElementById('newText');
        const newValue = document.getElementById('newValue');
        const addDomBtn = document.getElementById('addDomBtn');
        const addOptionBtn = document.getElementById('addOptionBtn');
        const removeDomBtn = document.getElementById('removeDomBtn');
        const removeMethodBtn = document.getElementById('removeMethodBtn');
        const removeNullBtn = document.getElementById('removeNullBtn');
        const getSelectedBtn = document.getElementById('getSelectedBtn');
        const selectedInfo = document.getElementById('selectedInfo');

        // Add event listeners
        addDomBtn.addEventListener('click', addUsingDOM);
        addOptionBtn.addEventListener('click', addUsingOption);
        removeDomBtn.addEventListener('click', removeUsingDOM);
        removeMethodBtn.addEventListener('click', removeUsingRemoveMethod);
        removeNullBtn.addEventListener('click', removeUsingNull);
        getSelectedBtn.addEventListener('click', showSelectedOption);

        // Function to add option using DOM methods
        function addUsingDOM() {
            const text = newText.value.trim();
            const value = newValue.value.trim();

            if (!text || !value) {
                alert('Please enter both text and value');
                return;
            }

            const option = document.createElement('option');
            option.text = text;
            option.value = value;
            locationSelect.add(option);

            // Clear inputs
            newText.value = '';
            newValue.value = '';
        }

        // Function to add option using Option constructor
        function addUsingOption() {
            const text = newText.value.trim();
            const value = newValue.value.trim();

            if (!text || !value) {
                alert('Please enter both text and value');
                return;
            }

            const option = new Option(text, value);
            locationSelect.add(option);

            // Clear inputs
            newText.value = '';
            newValue.value = '';
        }

        // Function to remove option using DOM methods
        function removeUsingDOM() {
            if (locationSelect.selectedIndex === -1) {
                alert('Please select an option to remove');
                return;
            }

            const optionToRemove = locationSelect.options[locationSelect.selectedIndex];
            locationSelect.removeChild(optionToRemove);
        }

        // Function to remove option using remove() method
        function removeUsingRemoveMethod() {
            if (locationSelect.selectedIndex === -1) {
                alert('Please select an option to remove');
                return;
            }

            locationSelect.remove(locationSelect.selectedIndex);
        }

        // Function to remove option by setting to null
        function removeUsingNull() {
            if (locationSelect.selectedIndex === -1) {
                alert('Please select an option to remove');
                return;
            }

            locationSelect.options[locationSelect.selectedIndex] = null;
        }

        // Function to show selected option info
        function showSelectedOption() {
            if (locationSelect.selectedIndex === -1) {
                selectedInfo.innerHTML = 'No option selected';
                return;
            }

            const selectedOption = locationSelect.options[locationSelect.selectedIndex];
            selectedInfo.innerHTML = `
                    <p>Selected Index: ${locationSelect.selectedIndex}</p>
                    <p>Text: ${selectedOption.text}</p>
                    <p>Value: ${selectedOption.value}</p>
                `;
        }
    </script>
</body>
</html>
