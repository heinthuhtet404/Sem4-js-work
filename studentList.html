<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f3f4f6;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        #student-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .student-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 250px;
            transition: transform 0.3s;
        }

        .student-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto 15px;
        }

        .student-card button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .student-card button:hover {
            background-color: #1e40af;
        }

        .info {
            margin-top: 15px;
            font-size: 14px;
            color: #444;
            text-align: center;
            display: none;
        }
    </style>
</head>

<body>
    <h1>Student Profiles</h1>
    <div id="student-list"></div> <!-- ကျောင်းသားများ၏ profile card များထည့်ရန် container div -->
    <script src="studentList.js"></script> <!-- JavaScript ဖိုင်ချိတ်ဆက်ခြင်း -->
</body>

</html>
